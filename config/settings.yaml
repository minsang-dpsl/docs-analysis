# 영업자료 NAICS/국가 추출 파이프라인 설정
# 주의: [PLACEHOLDER] 표시는 샘플로 보정하거나 실제 API 사양으로 확인해야 하는 값입니다.

backend: openrouter            # openrouter | google (google의 decisions 호출은 미구현)

openrouter:
  base_url: https://openrouter.ai/api/v1/chat/completions      # ICP 텍스트 생성용
  decisions_url: https://openrouter.ai/api/alpha/decisions     # 쪽별 의사결정용(alpha, 형식 변경 가능)
  model: google/gemini-decision-1      # 실존 확인됨
google:
  model: gemini-decision-1             # [PLACEHOLDER]

output_dir_name: gemini-decision-1     # output/<이 이름>/<PDF명>/ 아래에 저장

concurrency: 2
timeout_s: 180
retry:
  max_attempts: 5
  base_delay_s: 2.0
  max_delay_s: 60.0

# 집계 임계값 [PLACEHOLDER: 샘플로 보정]
thresholds:
  naics_min: 0.3            # 코드별 쪽 최댓값이 이 값 이상이면 후보
  country_relative: 0.25    # 쪽 내 국가 1순위 대비 비율
  country_min_abs: 0.05     # 국가 절대 하한

# 데이터 파일과 기대 개수(불일치 시 CountMismatch, --allow-count-mismatch로 우회)
data:
  naics_xlsx: data/2-6 digit_2022_Codes.xlsx
  naics_index_xlsx: data/2022_NAICS_Index_File.xlsx
  countries_csv: data/countries.csv
  naics_ko_csv: data/naics_ko.csv      # 선택
  expected:
    naics4: 308
    naics5: 689
    countries: 195

# API 제약 사전 검증값 [PLACEHOLDER: OpenRouter 문서에 한도 명시 없음. 2차 출처는 요청당 질문 1,000개. 첫 실호출로 확인]
limits:
  max_questions: 400
  max_options_per_question: 256
  id_regex: '^[A-Za-z0-9_\-]{1,64}$'

# NAICS 5자리 옵션 설명(Index File 제품 예시). 비용 폭증을 막기 위해 반드시 상한을 둡니다.
index:
  enabled: true
  max_terms: 6
  max_chars: 160
  # 정렬 우선순위 키워드(소문자 부분일치). 해당 용어를 먼저 채웁니다. 예: water purification
  priority_terms: []

# 비용 추정용 단가 (USD per 1M tokens)
pricing:                       # Google AI Studio 문서(gemini-decision-1, 유료 티어) 기준. OpenRouter 청구액은 응답 usage.cost 가 우선
  input_per_mtok: 0.10
  output_per_mtok: 0.0
estimate:
  chars_per_token: 3.5
  pdf_tokens_per_page: 1500    # [PLACEHOLDER] 첫 실호출 usage.input_tokens 로 보정
  output_tokens_per_page: 0    # Decisions 는 출력 토큰 0 (질문 수와 무관)

# 문서 단위 페이지 선택 (ICP 추출 입력용) [PLACEHOLDER: 샘플 4건 기준 초안]
page_selection:
  small_doc_pages: 5         # 전체가 이 쪽수 이하이면 전부 사용
  strong_score: 0.7          # 이 점수 이상 코드가 있는 쪽은 무조건 포함
  coverage: 0.8              # NAICS score 합 누적 비율
  max_pages: 6               # 강한 신호 + 커버 단계의 합집합 상한
  always_front: 2            # 항상 포함할 앞쪽 수(제품 정의)
  country_page_min_score: 0.2

# ICP 추출 단계
icp:
  backend: openrouter
  model: google/gemini-2.5-pro         # [PLACEHOLDER] 텍스트 생성 모델 ID
  naics_hint_top: 10
  naics_hint_min: 0.5
  naics_hint_fallback_top: 5
  country_weak_below: 0.4
